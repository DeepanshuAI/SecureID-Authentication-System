<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureID - Verify OTP</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div id="notification"></div>

    <div class="center-layout">
        <div class="card">
            <div class="text-center mb-6">
                <div style="width: 48px; height: 48px; background: var(--secondary-blue); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px;">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--primary-blue)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                </div>
                <h1>Check your email</h1>
                <p class="subtitle" id="otpSubtitle">We sent a verification code to your email.</p>
            </div>
            
            <form id="otpForm">
                <div class="otp-grid" id="otpContainer">
                    <input type="text" class="otp-box" maxlength="1" pattern="[0-9]" required>
                    <input type="text" class="otp-box" maxlength="1" pattern="[0-9]" required>
                    <input type="text" class="otp-box" maxlength="1" pattern="[0-9]" required>
                    <input type="text" class="otp-box" maxlength="1" pattern="[0-9]" required>
                    <input type="text" class="otp-box" maxlength="1" pattern="[0-9]" required>
                    <input type="text" class="otp-box" maxlength="1" pattern="[0-9]" required>
                </div>
                
                <button type="submit" class="btn mb-6" id="verifyBtn">Verify Code</button>
            </form>
            
            <div id="testModeContainer" style="display: none; text-align: center; margin-bottom: 20px;">
                <button type="button" class="btn" style="background: #e2e8f0; color: #475569; padding: 8px;" id="testOtpBtn">Get Test OTP (Evaluator Mode)</button>
                <div id="testOtpDisplay" style="margin-top: 8px; font-weight: bold; color: var(--primary-blue);"></div>
            </div>

            <div class="text-center">
                <span class="text-small text-muted">Didn't receive the code?</span> <a href="#" class="text-link" id="resendLink">Click to resend</a>
                <div class="text-small text-muted mt-2" style="margin-top: 8px;">Expires in <strong id="timer">03:00</strong></div>
            </div>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/main.js"></script>
</body>
</html>
