<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureID - Login</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div id="notification"></div>

    <div class="login-split">
        <div class="login-sidebar">
            <div>
                <h2 style="font-size: 28px; font-weight: 700; margin-bottom: 8px;">SecureID</h2>
                <p style="font-size: 16px; opacity: 0.9;">Secure authentication and identity management system.</p>
            </div>
            <div>
                <p style="font-size: 14px; opacity: 0.8;">&copy; 2026 SecureID. All rights reserved.</p>
            </div>
        </div>

        <div class="login-content">
            <div class="login-box">
                <div class="text-center mb-8">
                    <h1>Welcome back</h1>
                    <p class="subtitle">Please enter your details to sign in.</p>
                </div>
                
                <form id="loginForm">
                    <div class="form-group">
                        <label class="form-label" for="identifier">Email</label>
                        <input type="text" id="identifier" class="form-control" placeholder="Enter your email" required>
                    </div>
                    
                    <div class="form-group mb-6">
                        <label class="form-label" for="password">Password</label>
                        <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                    </div>

                    <div class="flex justify-between items-center mb-6">
                        <div class="checkbox-group">
                            <input type="checkbox" id="remember">
                            <label class="text-small" for="remember">Remember for 30 days</label>
                        </div>
                        <a href="#" class="text-link">Forgot password</a>
                    </div>
                    
                    <button type="submit" class="btn mb-4" id="loginBtn">Sign in</button>
                    <button type="button" class="btn btn-secondary w-full">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                        </svg>
                        Sign in with Google
                    </button>
                </form>
                
                <div class="text-center mt-6" style="margin-top: 32px;">
                    <span class="text-small text-muted">Don't have an account?</span> <a href="/register" class="text-link">Sign up</a>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/main.js"></script>
</body>
</html>
